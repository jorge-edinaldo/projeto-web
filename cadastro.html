<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se - ONG Esperança Viva</title>
    
    <link rel="stylesheet" href="css/estilo.css">
    
    <script src="js/script.js"></script>

</head>
<body>

    <header>
        <img src="imagens/logo.jpg" alt="Logotipo da ONG Esperança Viva" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projeto.html">Projetos</a></li>
                <li><a href="cadastro.html">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro de Voluntários</h2>
            <p>Preencha os campos abaixo para fazer parte da nossa rede de apoio.</p>
            
            <form action="#" method="POST">
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">

                    <label for="cpf">CPF (Formato: 000.000.000-00):</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" maxlength="14" title="Digite o CPF no formato: 000.000.000-00">

                    <label for="telefone">Telefone (Formato: (00) 00000-0000):</label>
                    <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\) \d{5}-\d{4}" placeholder="(00) 00000-0000" maxlength="15" title="Digite o telefone no formato: (00) 00000-0000">
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>
                    
                    <label for="cep">CEP (Formato: 00000-000):</label>
                    <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" placeholder="00000-000" maxlength="9" title="Digite o CEP no formato: 00000-000">
                </fieldset>

                <button type="submit">Finalizar Cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança Viva. Todos os direitos reservados.</p>
    </footer>
   
</body>
</html>
